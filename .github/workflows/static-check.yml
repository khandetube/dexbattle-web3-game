name: Static portfolio checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f index.html
          test -f style.css
          test -f app.js
          test -f README.md
          test -f contracts/DexBattleEscrow.sol
      - name: Check HTML/JS references
        run: |
          grep -q 'href="style.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'ethers@6.15.0' index.html
          grep -q 'TARGET_CHAIN_ID=11155111' app.js
      - name: Check Solidity source
        run: |
          grep -q 'pragma solidity' contracts/DexBattleEscrow.sol
          grep -q 'nonReentrant' contracts/DexBattleEscrow.sol
